<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' · ControlJob'">ControlJob</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/motion.css}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">CJ</span>
        <span class="brand-name">ControlJob</span>
    </a>
    <nav class="nav">
        <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">Dashboard</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/consertos/novo}" th:classappend="${activePage == 'novo'} ? 'active' : ''">Novo conserto</a>
        <a th:href="@{/lojistas}" th:classappend="${activePage == 'lojistas'} ? 'active' : ''">Lojistas</a>
        <a th:href="@{/historico}" th:classappend="${activePage == 'historico'} ? 'active' : ''">Histórico</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" th:classappend="${activePage == 'admin'} ? 'active' : ''">Admin</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}" th:classappend="${activePage == 'usuarios'} ? 'active' : ''">Usuários</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/relatorio}" th:classappend="${activePage == 'relatorio'} ? 'active' : ''">Relatório</a>
        <form class="logout" th:action="@{/logout}" method="post"><button type="submit">Sair</button></form>
    </nav>
</header>

<main class="container">
    <div th:if="${mensagem}" class="flash" th:text="${mensagem}"></div>
    <div th:replace="~{::content}">Conteúdo</div>
</main>
<script th:src="@{/js/page-transition.js}" defer></script>
</body>
</html>
