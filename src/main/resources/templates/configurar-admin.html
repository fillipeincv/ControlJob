<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar administrador · ControlJob</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/motion.css}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<main class="container narrow auth-page">
    <section class="panel form">
        <span class="brand-mark">CJ</span>
        <h1>Primeiro acesso</h1>
        <p class="muted">Defina a senha do administrador <strong th:text="${nomeAdministrador}">admin</strong>.</p>
        <form th:action="@{/configurar-admin}" th:object="${form}" method="post">
            <label>Nova senha<input th:field="*{senha}" type="password" autocomplete="new-password" required></label>
            <span class="error" th:errors="*{senha}"></span>
            <label>Confirmar senha<input th:field="*{confirmacaoSenha}" type="password" autocomplete="new-password" required></label>
            <span class="error" th:errors="*{confirmacaoSenha}"></span>
            <button class="btn btn-primary" type="submit">Criar acesso de administrador</button>
        </form>
    </section>
</main>
<script th:src="@{/js/page-transition.js}" defer></script>
</body>
</html>
