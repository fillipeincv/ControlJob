<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro · ControlJob</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/motion.css}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">CJ</span>
        <span class="brand-name">ControlJob</span>
    </a>
</header>

<main class="container narrow">
    <section class="panel">
        <h1 th:text="${status + ' · ' + (status == 404 ? 'Não encontrado' : (status == 409 ? 'Operação não permitida' : 'Não foi possível concluir'))}">
            Erro
        </h1>
        <p class="muted" th:text="${mensagem}">Ocorreu um erro.</p>
        <div class="form-actions">
            <a class="btn btn-primary" th:href="@{/}">Voltar ao dashboard</a>
        </div>
    </section>
</main>
<script th:src="@{/js/page-transition.js}" defer></script>
</body>
</html>
