spring.application.name=ControlJob
server.port=8080

# Banco H2 em arquivo (dados persistem entre reinícios)
spring.datasource.url=jdbc:h2:file:./data/controljob;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Salário fixo mensal (em reais) — altere conforme necessário
controljob.salario-fixo=${CONTROLJOB_SALARIO_FIXO:1500.00}

# Usuário que será configurado no primeiro acesso
controljob.admin.usuario=${CONTROLJOB_ADMIN_USUARIO:admin}

# E-mail — SMTP do Gmail (remetente)
# A senha do app fica no arquivo .env (fora do git). Veja .env.example.
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Para quem o relatório mensal é enviado
controljob.email.remetente=${MAIL_USERNAME:}
controljob.email.destinatario=${MAIL_DESTINATARIO:}
controljob.email.assunto=${MAIL_ASSUNTO:Relatório Mensal de Pagamentos}

# Diretório onde ficam os arquivos de auditoria (JSON) e os PDFs do fechamento mensal
controljob.auditoria.diretorio=${CONTROLJOB_AUDITORIA_DIRETORIO:./data/auditoria}
